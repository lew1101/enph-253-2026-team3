syntax = "proto3";

package robot;

message VelocityCommand {
    // Robot-frame velocity requests. Percentages are scaled to the drivetrain's
    // configured maximum translation speed and heading rate, then tracked by
    // the pose PIDs.
    float vx_percent = 1; // right/left velocity
    float vy_percent = 2; // forward/backward velocity
    float omega_percent = 3; // counter-clockwise/clockwise heading rate
}

message PoseCommand {
    float x_m = 1;
    float y_m = 2;
    float theta_rad = 3;
    // When true, x/y are robot-frame offsets from the measured pose and
    // theta is an offset from the measured heading.
    bool relative = 4;
    // Maximum rate at which the path reference advances toward the target.
    // Zero (or an omitted field) uses the drivetrain default.
    float desired_speed_mps = 5;
}

message TapeFollowCommand {
    float forward_speed_percent = 1;
}

message TapeAlignmentCommand {
    // Sign along robot-frame X used to reach the staging side before scanning.
    // Zero (or an omitted field) uses the drivetrain default of -1.
    float staging_direction = 1;
}

message StopCommand {
    bool brake = 1;
}

message DriveCommand {
    uint32 sequence = 1;
    oneof command {
        VelocityCommand velocity = 2;
        TapeFollowCommand tape_follow = 3;
        PoseCommand pose = 4;
        StopCommand stop = 5;
        TapeAlignmentCommand tape_alignment = 6;
    }
}
